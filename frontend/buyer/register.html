<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buyer Register – YarnBazaar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div style="min-height:100vh;background:linear-gradient(135deg,#E8F5E9 0%,#fff 50%,#F1F8E9 100%);padding:32px 16px">
<div style="max-width:480px;margin:0 auto">
  <div class="mb-4"><a href="/buyer/login.html" class="text-green font-bold text-sm">← Back to Login</a></div>
  <div class="card" style="border-radius:var(--radius-xl)">
    <h2 style="font-size:22px;font-weight:900;margin-bottom:4px">Create Buyer Account</h2>
    <p class="text-sm text-gray mb-6">Join YarnBazaar to find the best yarn suppliers across India</p>

    <div id="err-msg" class="hidden" style="background:var(--red-light);color:var(--red);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>
    <div id="ok-msg"  class="hidden" style="background:var(--green-light);color:var(--green-dark);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>

    <form id="reg-form">
      <div class="mb-4">
        <label class="input-label">Full Name *</label>
        <input id="fullName" class="input" type="text" placeholder="Rajesh Kumar" required>
      </div>
      <div class="mb-4">
        <label class="input-label">WhatsApp Number *</label>
        <input id="whatsappNumber" class="input" type="text" maxlength="10" placeholder="10-digit number" required>
      </div>
      <div class="mb-4">
        <label class="input-label">Email <span style="font-weight:400;text-transform:none">(Optional)</span></label>
        <input id="email" class="input" type="email" placeholder="buyer@email.com">
      </div>
      <div class="mb-4">
        <label class="input-label">Password *</label>
        <input id="password" class="input" type="password" placeholder="Min 6 characters" required>
      </div>
      <div class="mb-6">
        <label class="input-label">Confirm Password *</label>
        <input id="confirmPassword" class="input" type="password" placeholder="Repeat password" required>
      </div>
      <button type="submit" id="sub-btn" class="btn btn-primary btn-full btn-lg">Create Account</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--gray-500)">
      Already have an account? <a href="/buyer/login.html" style="color:var(--green);font-weight:700">Sign in</a>
    </p>
  </div>
</div>
</div>

<script>
  const API = '/api';

  document.getElementById('reg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('err-msg'), okEl = document.getElementById('ok-msg');
    errEl.classList.add('hidden'); okEl.classList.add('hidden');

    const fullName = document.getElementById('fullName').value.trim();
    const whatsappNumber = document.getElementById('whatsappNumber').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!fullName) { errEl.textContent='Full name is required.'; errEl.classList.remove('hidden'); return; }
    if (!/^[6-9]\d{9}$/.test(whatsappNumber)) { errEl.textContent='Enter a valid 10-digit WhatsApp number.'; errEl.classList.remove('hidden'); return; }
    if (!password || password.length < 6) { errEl.textContent='Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
    if (password !== confirmPassword) { errEl.textContent='Passwords do not match.'; errEl.classList.remove('hidden'); return; }

    const btn = document.getElementById('sub-btn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const res = await fetch(`${API}/auth/buyer/register`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ fullName, whatsappNumber, email: email||undefined, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');
      okEl.textContent = 'Account created! Redirecting to login…';
      okEl.classList.remove('hidden');
      setTimeout(() => location.href = '/buyer/login.html', 2000);
    } catch(err) {
      errEl.textContent = err.message; errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
