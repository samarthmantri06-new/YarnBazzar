<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Buyer Register – YarnMarket</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .tabs { display: flex; border-bottom: 2px solid var(--gray-200); margin-bottom: 24px; }
    .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 600; color: var(--gray-500); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: 0.2s; }
    .tab.active { color: var(--green); border-bottom-color: var(--green); }
    .tab:hover:not(.active) { color: var(--gray-800); }
    .dynamic-field { display: none; }
    .dynamic-field.show { display: block; }
  </style>
</head>
<body>
<div style="min-height:100vh;background:linear-gradient(135deg,#E8F5E9 0%,#fff 50%,#F1F8E9 100%);padding:32px 16px">
<div style="max-width:480px;margin:0 auto">
  <div class="mb-4"><a href="/buyer/login.html" class="text-green font-bold text-sm">← Back to Login</a></div>
  <div class="card" style="border-radius:var(--radius-xl)">
    <h2 style="font-size:22px;font-weight:900;margin-bottom:4px">Create Buyer Account</h2>
    <p class="text-sm text-gray mb-6">Select your role and set up your YarnMarket profile</p>

    <div class="tabs">
      <div class="tab active" data-role="agent">Agent</div>
      <div class="tab" data-role="trader">Trader</div>
      <div class="tab" data-role="manufacturer">Manufacturer</div>
    </div>

    <div id="err-msg" class="hidden" style="background:var(--red-light);color:var(--red);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>
    <div id="ok-msg"  class="hidden" style="background:var(--green-light);color:var(--green-dark);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>

    <form id="reg-form">
      <!-- Hidden role input -->
      <input type="hidden" id="role" value="agent">

      <div class="mb-4">
        <label class="input-label">Full Name *</label>
        <input id="fullName" class="input" type="text" placeholder="Rajesh Kumar" required>
      </div>
      <div class="mb-4">
        <label class="input-label">WhatsApp Number *</label>
        <input id="whatsappNumber" class="input" type="text" maxlength="10" placeholder="10-digit number" required>
      </div>
      <div class="mb-4">
        <label class="input-label">Email <span id="email-opt" style="font-weight:400;text-transform:none">(Optional)</span></label>
        <input id="email" class="input" type="email" placeholder="buyer@email.com">
      </div>
      
      <!-- Trader / Manufacturer specific fields -->
      <div class="dynamic-field mb-4" id="gst-field">
        <label class="input-label">GST Number *</label>
        <input id="gstNumber" class="input" type="text" placeholder="e.g. 27ABCDE1234F1Z5">
      </div>
      <div class="dynamic-field mb-4" id="office-field">
        <label class="input-label">Office Address *</label>
        <input id="officeAddress" class="input" type="text" placeholder="Full Office Address">
      </div>
      
      <!-- Manufacturer specific field -->
      <div class="dynamic-field mb-4" id="factory-field">
        <label class="input-label">Factory Address *</label>
        <input id="factoryAddress" class="input" type="text" placeholder="Full Factory Address">
      </div>

      <div class="mb-4">
        <label class="input-label">Password *</label>
        <div style="position:relative;">
          <input id="password" class="input" type="password" placeholder="Min 6 characters" style="padding-right:40px;width:100%;box-sizing:border-box;" required>
          <button type="button" onclick="togglePasswordVisibility('password', this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--gray-400);line-height:1;padding:4px;user-select:none;">👁️</button>
        </div>
      </div>
      <div class="mb-6">
        <label class="input-label">Confirm Password *</label>
        <div style="position:relative;">
          <input id="confirmPassword" class="input" type="password" placeholder="Repeat password" style="padding-right:40px;width:100%;box-sizing:border-box;" required>
          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--gray-400);line-height:1;padding:4px;user-select:none;">👁️</button>
        </div>
      </div>
      <button type="submit" id="sub-btn" class="btn btn-primary btn-full btn-lg">Create Account</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--gray-500)">
      Already have an account? <a href="/buyer/login.html" style="color:var(--green);font-weight:700">Sign in</a>
    </p>
  </div>
</div>
</div>

<script>
  const API = '/api';
  const roleInput = document.getElementById('role');
  const tabs = document.querySelectorAll('.tab');
  
  const gstField = document.getElementById('gst-field');
  const officeField = document.getElementById('office-field');
  const factoryField = document.getElementById('factory-field');
  const emailOpt = document.getElementById('email-opt');
  const emailInput = document.getElementById('email');
  const gstInput = document.getElementById('gstNumber');
  const officeInput = document.getElementById('officeAddress');
  const factoryInput = document.getElementById('factoryAddress');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const selectedRole = tab.dataset.role;
      roleInput.value = selectedRole;

      // Reset dynamic fields
      gstField.classList.remove('show');
      officeField.classList.remove('show');
      factoryField.classList.remove('show');
      emailOpt.style.display = 'inline';
      
      emailInput.removeAttribute('required');
      gstInput.removeAttribute('required');
      officeInput.removeAttribute('required');
      factoryInput.removeAttribute('required');

      if (selectedRole === 'trader' || selectedRole === 'manufacturer') {
        gstField.classList.add('show');
        officeField.classList.add('show');
        emailOpt.style.display = 'none'; // Email becomes required
        emailInput.setAttribute('required', 'true');
        gstInput.setAttribute('required', 'true');
        officeInput.setAttribute('required', 'true');
      }

      if (selectedRole === 'manufacturer') {
        factoryField.classList.add('show');
        factoryInput.setAttribute('required', 'true');
      }
    });
  });

  document.getElementById('reg-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('err-msg'), okEl = document.getElementById('ok-msg');
    errEl.classList.add('hidden'); okEl.classList.add('hidden');

    const role = roleInput.value;
    const fullName = document.getElementById('fullName').value.trim();
    const whatsappNumber = document.getElementById('whatsappNumber').value.trim();
    const email = emailInput.value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    const gstNumber = gstInput.value.trim();
    const officeAddress = officeInput.value.trim();
    const factoryAddress = factoryInput.value.trim();

    if (!fullName) { errEl.textContent='Full name is required.'; errEl.classList.remove('hidden'); return; }
    if (!/^[6-9]\d{9}$/.test(whatsappNumber)) { errEl.textContent='Enter a valid 10-digit WhatsApp number.'; errEl.classList.remove('hidden'); return; }
    if (!password || password.length < 6) { errEl.textContent='Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
    if (password !== confirmPassword) { errEl.textContent='Passwords do not match.'; errEl.classList.remove('hidden'); return; }

    const payload = { role, fullName, whatsappNumber, password };
    if (email) payload.email = email;
    if (role === 'trader' || role === 'manufacturer') {
      if (!gstNumber) { errEl.textContent='GST Number is required.'; errEl.classList.remove('hidden'); return; }
      if (!officeAddress) { errEl.textContent='Office Address is required.'; errEl.classList.remove('hidden'); return; }
      payload.gstNumber = gstNumber;
      payload.officeAddress = officeAddress;
    }
    if (role === 'manufacturer') {
      if (!factoryAddress) { errEl.textContent='Factory Address is required.'; errEl.classList.remove('hidden'); return; }
      payload.factoryAddress = factoryAddress;
    }

    const btn = document.getElementById('sub-btn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const res = await fetch(`${API}/auth/buyer/register`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');
      okEl.textContent = 'Account created! Redirecting to login…';
      okEl.classList.remove('hidden');
      setTimeout(() => location.href = '/buyer/login.html', 2000);
    } catch(err) {
      errEl.textContent = err.message; errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });

  function togglePasswordVisibility(id, btn) {
    const el = document.getElementById(id);
    if (el.type === 'password') {
      el.type = 'text';
      btn.textContent = '🙈';
    } else {
      el.type = 'password';
      btn.textContent = '👁️';
    }
  }
</script>
</body>
</html>
