<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YarnBazaar Platform</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      font-family: 'Inter', sans-serif;
    }

    .landing-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
      max-width: 500px;
      width: 90%;
    }

    h1 {
      color: #166534;
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    p {
      color: #4b5563;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      padding: 1rem 1.5rem;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2);
    }

    .btn:hover {
      background: #15803d;
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(22, 163, 74, 0.3);
    }

    .btn.admin {
      background: #4b5563;
      box-shadow: 0 4px 6px rgba(75, 85, 99, 0.2);
    }

    .btn.admin:hover {
      background: #374151;
      box-shadow: 0 6px 8px rgba(75, 85, 99, 0.3);
    }
  </style>
</head>

<body>
  <div class="landing-card">
    <h1>YarnBazaar</h1>
    <p>Welcome! Please select a portal to continue.</p>
    <div class="links">
      <a href="/seller/login.html" class="btn">Login as Seller</a>
      <a href="/buyer/login.html" class="btn">Login as Buyer</a>
    </div>
  </div>


</body>
</html>
