<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password – YarnMarket</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div style="min-height:100vh;background:linear-gradient(135deg,#E8F5E9 0%,#fff 50%,#F1F8E9 100%);display:flex;align-items:center;justify-content:center;padding:16px">
<div class="card" style="width:100%;max-width:400px;border-radius:var(--radius-xl)">
  <h2 style="font-size:24px;font-weight:900;margin-bottom:8px">Forgot Password</h2>
  <p class="text-sm text-gray mb-6">Enter your registered WhatsApp number to receive a password reset link.</p>

  <div id="err-msg" class="hidden" style="background:var(--red-light);color:var(--red);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>
  <div id="ok-msg"  class="hidden" style="background:var(--green-light);color:var(--green-dark);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>

  <form id="forgot-form">
    <div class="mb-4">
      <label class="input-label">WhatsApp Number</label>
      <input id="whatsappNumber" class="input" type="text" placeholder="10-digit number" required>
    </div>
    
    <button type="submit" id="sub-btn" class="btn btn-primary btn-full btn-lg mb-4">Send Reset Link</button>
    
    <div id="support-box" style="text-align:center;font-size:13px" class="hidden">
      <p class="text-gray mb-2">No email is linked to this number.</p>
      <a href="https://wa.me/919209219459?text=Hi%20YarnMarket%20Support,%20I%20forgot%20my%20password%20and%20don't%20have%20an%20email%20linked.%20Please%20help%20me%20reset%20it." target="_blank" class="btn btn-full" style="background:#25D366;color:#fff;display:inline-block;text-align:center;padding:10px;border-radius:8px;font-weight:bold;text-decoration:none;">Contact Support on WhatsApp</a>
    </div>
  </form>
</div>
</div>

<script>
  const API = '/api';
  const urlParams = new URLSearchParams(window.location.search);
  const role = urlParams.get('role') || 'buyer';

  document.getElementById('forgot-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('err-msg');
    const okEl = document.getElementById('ok-msg');
    const btn = document.getElementById('sub-btn');
    const supportBox = document.getElementById('support-box');
    
    errEl.classList.add('hidden');
    okEl.classList.add('hidden');
    supportBox.classList.add('hidden');
    
    const whatsappNumber = document.getElementById('whatsappNumber').value.trim();
    if (!whatsappNumber) return;

    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const res = await fetch(`${API}/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ whatsappNumber, role })
      });
      const data = await res.json();
      
      if (!res.ok) {
        if (data.error === 'NO_EMAIL') {
          supportBox.classList.remove('hidden');
          throw new Error('This account does not have an email address associated with it. Please contact support via WhatsApp to reset your password.');
        }
        throw new Error(data.error || 'Failed to send reset link');
      }
      
      okEl.textContent = data.message || 'A password reset link has been sent to the email registered with this number.';
      okEl.classList.remove('hidden');
      document.getElementById('whatsappNumber').value = '';
    } catch(err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>
