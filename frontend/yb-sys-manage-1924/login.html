<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login – YarnBazaar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login-page" style="background:linear-gradient(135deg,#FFEBEE 0%,#fff 50%,#FFF3E0 100%)">
  <div class="login-card">
    <div class="login-logo">
      <div style="width:52px;height:52px;border-radius:14px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:900;margin:0 auto 12px">Y</div>
      <h1 style="font-size:22px;font-weight:900;color:var(--red)">YarnBazaar Admin</h1>
      <p style="font-size:13px;color:var(--gray-400);margin-top:2px">Restricted access</p>
    </div>
    <h2 style="font-size:20px;font-weight:800;margin-bottom:6px">Admin Sign In</h2>
    <p class="text-sm text-gray mb-6">Manage sellers, buyers and platform settings</p>

    <div id="error-msg" class="hidden" style="background:var(--red-light);color:var(--red);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>

    <form id="login-form">
      <div class="mb-4">
        <label class="input-label">Admin Email</label>
        <input id="email" type="email" class="input" placeholder="admin@yarnbazaar.in" required>
      </div>
      <div class="mb-6">
        <label class="input-label">Password</label>
        <div style="position:relative;">
          <input id="password" type="password" class="input" placeholder="••••••••" style="padding-right:40px;width:100%;box-sizing:border-box;" required>
          <button type="button" onclick="togglePasswordVisibility('password', this)" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--gray-400);line-height:1;padding:4px;user-select:none;">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-lg btn-full" style="background:var(--red);color:#fff" id="submit-btn">Sign In as Admin</button>
    </form>

    <script>
      function togglePasswordVisibility(id, btn) {
        const el = document.getElementById(id);
        if (el.type === 'password') {
          el.type = 'text';
          btn.textContent = '🙈';
        } else {
          el.type = 'password';
          btn.textContent = '👁️';
        }
      }
    </script>
  </div>
</div>

<script>
  const API = '/api';
  if (localStorage.getItem('adminToken')) location.href = '/yb-sys-manage-1924/dashboard.html';

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    const errEl = document.getElementById('error-msg');
    errEl.classList.add('hidden');
    try {
      const res = await fetch(`${API}/auth/admin/login`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      localStorage.setItem('adminToken', data.token);
      localStorage.setItem('adminUser', JSON.stringify(data.admin || data.user));
      location.href = '/yb-sys-manage-1924/dashboard.html';
    } catch(err) {
      errEl.textContent = err.message; errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Sign In as Admin';
    }
  });
</script>
</body>
</html>
