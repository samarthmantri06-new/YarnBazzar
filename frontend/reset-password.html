<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password – YarnBazaar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div style="min-height:100vh;background:linear-gradient(135deg,#E8F5E9 0%,#fff 50%,#F1F8E9 100%);display:flex;align-items:center;justify-content:center;padding:16px">
<div class="card" style="width:100%;max-width:400px;border-radius:var(--radius-xl)">
  <h2 style="font-size:24px;font-weight:900;margin-bottom:8px">Create New Password</h2>
  <p class="text-sm text-gray mb-6">Enter your new password below.</p>

  <div id="err-msg" class="hidden" style="background:var(--red-light);color:var(--red);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>
  <div id="ok-msg"  class="hidden" style="background:var(--green-light);color:var(--green-dark);padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px"></div>

  <form id="reset-form">
    <div class="mb-3">
      <label class="input-label">New Password</label>
      <input id="newPassword" class="input" type="password" placeholder="Min 6 characters" required>
    </div>
    <div class="mb-4">
      <label class="input-label">Confirm Password</label>
      <input id="confirmPassword" class="input" type="password" placeholder="Repeat new password" required>
    </div>
    
    <button type="submit" id="sub-btn" class="btn btn-primary btn-full btn-lg">Reset Password</button>
  </form>
</div>
</div>

<script>
  const API = '/api';
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const role = urlParams.get('role');

  if (!token || !role) {
    document.getElementById('err-msg').textContent = 'Invalid or missing reset token.';
    document.getElementById('err-msg').classList.remove('hidden');
    document.getElementById('sub-btn').disabled = true;
  }

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('err-msg');
    const okEl = document.getElementById('ok-msg');
    const btn = document.getElementById('sub-btn');
    
    errEl.classList.add('hidden');
    okEl.classList.add('hidden');
    
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      errEl.classList.remove('hidden');
      return;
    }

    if (newPassword !== confirmPassword) {
      errEl.textContent = 'Passwords do not match.';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      const res = await fetch(`${API}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, role, newPassword })
      });
      const data = await res.json();
      
      if (!res.ok) throw new Error(data.error || 'Failed to reset password');
      
      okEl.textContent = data.message || 'Password reset successfully.';
      okEl.classList.remove('hidden');
      
      // Redirect to login after 2 seconds
      setTimeout(() => {
        window.location.href = `/${role}/login.html`;
      }, 2000);

    } catch(err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  });
</script>
</body>
</html>
